name: Oneli host-only console-summary v2 boot update
on:
  workflow_dispatch:
  push:
    branches: ['razr/boot']
    paths:
      - '.github/workflows/boot-native-console-v2.yml'
      - 'scripts/repackage_oneli_native_console_v2.py'
      - 'configs/oneli-native-host-console-v2-input-lock.json'
permissions:
  contents: read
  actions: read
jobs:
  one-diagnostic-repackage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ntherning/mkbootimg
          ref: 7209a7164f1772db43f92928012c86a00f6202ff
          path: pinned-aosp
          persist-credentials: false
      - name: Fetch previously accepted immutable inputs, not rebuilds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd gzip
          mkdir -p inputs/kernel inputs/userspace-v2 inputs/vendor-v1 dl kernel-dl independent/unpack
          gh run download 38292394177 --repo Drzet/linux --name oneli-combined-bundle-38292394177-1 --dir kernel-dl
          printf '%s  %s\n' '5338b42efa668b8755c5cff7d12ef9d1ede46106c3abe17cf30118030c009896' kernel-dl/combined-bundle.tar.zst | sha256sum -c -
          tar --zstd -xf kernel-dl/combined-bundle.tar.zst -C inputs/kernel ./Image ./kernel.config ./sm8475-motorola-oneli.dtb ./kernel.release
          gh run download 38317559417 --repo Drzet/razr2022_nuc --name native-diag-v2-38317559417-1 --dir inputs/userspace-v2
          (cd inputs/userspace-v2 && sha256sum -c SHA256SUMS)
          gh run download 38310449244 --repo Drzet/razr2022_nuc --name oneli-native-host-only-v1 --dir inputs/vendor-v1
          (cd inputs/vendor-v1 && sha256sum -c SHA256SUMS)
          printf '%s  %s\n' '1b4f6379b41e22735176bf63c725d3455d47c7b510f29d0de62b408da5f47572' inputs/vendor-v1/vendor_boot-candidate.UNSIGNED.img | sha256sum -c -
      - name: Repackage only changed generic initramfs and verify console content
        run: |
          set -Eeuo pipefail
          python3 scripts/repackage_oneli_native_console_v2.py \
            --kernel-dir inputs/kernel \
            --payload-dir inputs/userspace-v2 \
            --vendor-boot-v1 inputs/vendor-v1/vendor_boot-candidate.UNSIGNED.img \
            --header-inputs configs/oneli-native-host-header-inputs-v1.json \
            --input-lock configs/oneli-native-host-console-v2-input-lock.json \
            --output out
          test ! -e out/vendor_boot-candidate.UNSIGNED.img
          python3 scripts/oneli_boot_v4_layout.py inspect \
            out/boot-console-v2.UNSIGNED.img \
            inputs/vendor-v1/vendor_boot-candidate.UNSIGNED.img \
            > out/secondary-v4-inspection.json
      - name: Independent AOSP unpack, changed-payload SHA and section checks
        run: |
          set -Eeuo pipefail
          python3 pinned-aosp/unpack_bootimg.py \
            --boot_img out/boot-console-v2.UNSIGNED.img \
            --out independent/unpack > out/aosp-v2-unpack.log
          python3 pinned-aosp/mkbootimg.py \
            --header_version 4 \
            --kernel inputs/kernel/Image \
            --ramdisk inputs/userspace-v2/oneli-diag-initramfs.cpio.gz \
            --cmdline '' --output independent/aosp-v2-repacked.img
          python3 scripts/oneli_boot_v4_layout.py inspect \
            independent/aosp-v2-repacked.img \
            inputs/vendor-v1/vendor_boot-candidate.UNSIGNED.img \
            > out/independent-aosp-v2-layout.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def require(cond,msg):
              if not cond: raise ValueError(msg)
          lock=json.loads(Path('configs/oneli-native-host-console-v2-input-lock.json').read_text())
          report=json.loads(Path('out/boot-console-v2-inspection.json').read_text())
          ours=json.loads(Path('out/secondary-v4-inspection.json').read_text())
          aosp=json.loads(Path('out/independent-aosp-v2-layout.json').read_text())
          need={
             'kernel':('independent/unpack/kernel',lock['frozen_kernel']['Image_sha256']),
             'generic_ramdisk':('independent/unpack/ramdisk',lock['userspace_v2']['compressed_sha256'])
          }
          for key,(name,expected) in need.items():
              require(sha(name)==expected,'AOSP unpack changed payload mismatch: '+key)
          for section in ('kernel','ramdisk','signature'):
              o=next(v for v in ours['boot']['sections'] if v['name']==section)
              a=next(v for v in aosp['boot']['sections'] if v['name']==section)
              require((o['sha256'],o['bytes'])==(a['sha256'],a['bytes']),section+' AOSP parity')
          require(ours['boot']['os_version_raw']==0 and
                  ours['boot']['cmdline']=='' and
                  ours['boot']['sections'][-1]['bytes']==0,'v4 unsigned header policy')
          require(ours['vendor_boot']['sha256']==lock['immutable_vendor_boot_v1']['vendor_boot_sha256'],
                  'vendor_boot immutable mismatch')
          require(sha('out/boot-console-v2.UNSIGNED.img')!=lock['previous_generic_v1']['boot_image_sha256'],
                  'new diagnostic payload did not change boot image')
          require(report['v2_console_probe_summary']['positive_lines']>0 and
                  report['v2_console_probe_summary']['hold_lines']>0,
                  'console body fixture not independently observed')
          require(report['native_flash_approved'] is False and report['hardware_tested'] is False,
                  'unsafe phone-ready marker')
          report['result']='independent-aosp-v4-unpack-and-repack-pass'
          report['independent_aosp_image_sections']='passed'
          report['previous_host_candidate_preserved']=True
          Path('out/boot-console-v2-inspection.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('RAZR_NATIVE_DIAG_CONSOLE_V2_BOOT_HOST_PASS')
          PY
          (cd out && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oneli-native-boot-console-v2
          path: out/
          retention-days: 30
          if-no-files-found: warn

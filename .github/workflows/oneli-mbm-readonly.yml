name: Oneli MBM read-only public firmware inspection
on:
  push:
    branches:
      - research/oneli-mbm-readonly-20261015
    paths:
      - 'scripts/inspect-oneli-mbm-public-reference.py'
      - 'scripts/analyze-oneli-mbm-loader-structures.py'
      - '.github/workflows/oneli-mbm-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install read-only analysis utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils file
          readelf --version | head -1
          python3 --version
      - name: Bounded Motorola bootloader member inspection
        run: |
          set -euo pipefail
          python3 scripts/analyze-oneli-mbm-loader-structures.py
          git rev-parse HEAD > evidence/research-commit.txt
      - name: Publish text metadata only; no firmware bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oneli-mbm-reference-metadata
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

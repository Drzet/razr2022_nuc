name: Oneli MBM read-only public firmware inspection
on:
  push:
    branches:
      - research/oneli-mbm-readonly-20261015
    paths:
      - 'scripts/inspect-oneli-mbm-public-reference.py'
      - 'scripts/analyze-oneli-mbm-loader-structures.py'
      - 'scripts/analyze-oneli-mbm-efi-executables.py'
      - 'scripts/analyze-oneli-mbm-xrefs.py'
      - 'scripts/analyze-oneli-mbm-placement.py'
      - '.github/workflows/oneli-mbm-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install read-only analysis utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils file llvm python3-venv python3-dev gcc
          python3 -m venv "$RUNNER_TEMP/mbm-venv"
          "$RUNNER_TEMP/mbm-venv/bin/pip" install --disable-pip-version-check uefi_firmware==1.16 pefile==2024.8.26 capstone==5.0.6
          echo "$RUNNER_TEMP/mbm-venv/bin" >> "$GITHUB_PATH"
          readelf --version | head -1
          python3 --version
      - name: Bounded Motorola bootloader member inspection
        run: |
          set -euo pipefail
          python3 scripts/analyze-oneli-mbm-placement.py
          git rev-parse HEAD > evidence/research-commit.txt
      - name: Publish text metadata only; no firmware bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oneli-mbm-reference-metadata
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

name: Debian ARM64 userspace QEMU smoke
on:
  workflow_dispatch:
  push:
    branches: ['razr/userspace']
    paths:
      - '.github/workflows/userspace-qemu.yml'
      - 'userspace/**'
      - 'scripts/build-userspace.sh'
      - 'scripts/smoke-qemu.sh'
  pull_request:
    paths:
      - '.github/workflows/userspace-qemu.yml'
      - 'userspace/**'
      - 'scripts/build-userspace.sh'
      - 'scripts/smoke-qemu.sh'
permissions:
  contents: read
concurrency:
  group: userspace-qemu-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out coordinator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Input and syntax checks
        run: |
          bash -n scripts/build-userspace.sh scripts/smoke-qemu.sh scripts/verify-rootfs-ownership.sh
          source userspace/inputs.env
          test "$DEBIAN_ARCH" = arm64
          test "$DEBIAN_SUITE" = trixie
      - name: Install bootstrap and emulation tools
        run: |
          mkdir -p evidence
          sudo apt-get update 2>&1 | tee evidence/host-apt-update.log
          sudo apt-get install -y --no-install-recommends debootstrap qemu-user-static binfmt-support qemu-system-arm debian-archive-keyring e2fsprogs zstd xz-utils ca-certificates gnupg wget ipxe-qemu openssh-client openssl 2>&1 | tee evidence/host-apt-install.log
      - name: Build ARM64 Debian root filesystem
        run: sudo env GITHUB_SHA="$GITHUB_SHA" bash scripts/build-userspace.sh "$RUNNER_TEMP/razr-userspace-build" "$GITHUB_WORKSPACE/evidence"
      - name: Emulate guest boot, DHCP and authenticated SSH
        run: sudo bash scripts/smoke-qemu.sh "$RUNNER_TEMP/razr-userspace-build" "$GITHUB_WORKSPACE/evidence"
      - name: Retain all build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: userspace-qemu-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
      - name: Record validation scope
        if: always()
        run: |
          {
            echo '## Debian ARM64 userspace'
            echo "Project SHA: $GITHUB_SHA"
            echo 'Check evidence qemu-serial.log for RAZR_USERSPACE_SMOKE_PASS and qemu-exit-code.txt for 0.'
            echo 'This is QEMU virt running a Debian kernel, NOT oneli hardware or the native kernel.'
          } >> "$GITHUB_STEP_SUMMARY"

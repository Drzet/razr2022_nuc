name: Oneli self-contained v2 RAM diagnostic packaging (offline only)

on:
  push:
    branches: [razr/boot]
    paths:
      - 'scripts/package_oneli_native_v2_ram_diag.py'
      - '.github/workflows/boot-native-v2-ram-diag.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: oneli-native-v2-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-packaging-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout BOOT packaging code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cheap syntax/recipe gate before any downloads
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/package_oneli_native_v2_ram_diag.py scripts/package_oneli_reduced_native_diag.py
          python3 scripts/package_oneli_native_v2_ram_diag.py --check-recipe --header-inputs configs/oneli-native-host-header-inputs-v1.json
      - name: Checkout pinned AOSP pack/unpack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ntherning/mkbootimg
          ref: 7209a7164f1772db43f92928012c86a00f6202ff
          path: pinned-aosp
          persist-credentials: false
      - name: Download exact accepted Image, DTB and early initramfs artifacts
        run: |
          set -euo pipefail
          mkdir -p inputs/producer inputs/userspace evidence unpacked independent
          test "$(git -C pinned-aosp rev-parse HEAD)" = 7209a7164f1772db43f92928012c86a00f6202ff
          gh run download 39170486506 --repo Drzet/razr2022_nuc --name oneli-reduced-image-modules-39170486506-1 --dir inputs/producer
          gh run download 39237882830 --repo Drzet/razr2022_nuc --name userspace-reduced-evidence-39237882830-1 --dir inputs/userspace
          test -s inputs/producer/release/Image
          test -s inputs/producer/release/sm8475-motorola-oneli.dtb
          test -s inputs/producer/release/SHA256SUMS
          test -s inputs/userspace/reduced-early/radio-early.cpio.gz
          {
            echo "project_commit=$GITHUB_SHA"
            echo "aosp_commit=$(git -C pinned-aosp rev-parse HEAD)"
            echo "kernel_source=7f3865ee17c37146e183a45cd8ff2b6c59d0e9ce"
            echo "kernel_producer_run=39170486506"
            echo "kernel_producer_artifact=12153785196"
            echo "early_run=39237882830"
            echo "early_artifact=12180445735"
            python3 --version
          } > evidence/source-identity.txt
      - name: Package exactly one unsigned Android boot-v2 candidate
        run: |
          set -euo pipefail
          python3 scripts/package_oneli_native_v2_ram_diag.py --producer inputs/producer --early inputs/userspace --aosp-mkbootimg pinned-aosp/mkbootimg.py --header-inputs configs/oneli-native-host-header-inputs-v1.json --output out | tee evidence/recipe-result.txt
      - name: Independent AOSP unpack, byte checks and full-image roundtrip
        run: |
          set -euo pipefail
          image=out/oneli-reduced-radio-diag-boot-v2.RAM-TRIAL.UNSIGNED.img
          python3 pinned-aosp/unpack_bootimg.py --boot_img "$image" --out unpacked > evidence/aosp-v2-unpack-info.txt
          python3 pinned-aosp/unpack_bootimg.py --boot_img "$image" --out independent --format mkbootimg > evidence/aosp-v2-reconstruction-arguments.txt
          python3 - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import package_oneli_native_v2_ram_diag as pkg
          report=json.loads(Path("out/offline-v2-validation.json").read_text())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for folder in ("unpacked","independent"):
              assert {p.name for p in Path(folder).iterdir()}=={"kernel","ramdisk","dtb"}, "unexpected optional boot sections"
              for name,key in (("kernel","image_sha256"),("ramdisk","early_gzip_sha256"),("dtb","dtb_sha256")):
                  assert sha(folder+"/"+name)==report[key], (folder,name)
          assert "boot image header version: 2" in Path("evidence/aosp-v2-unpack-info.txt").read_text()
          assert report["v2_header"]["all_optional_regions_empty"] and report["v2_header"]["zero_padding_all_sections"]
          assert report["v2_header"]["header_version"]==2 and report["flash_approved"] is False
          report["v2_aosp_independent_unpack"]="PASS"
          Path("out/offline-v2-validation.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("ONELI_V2_AOSP_UNPACK_3_OF_3_PAYLOAD_HASHES_PASS")
          PY
          python3 pinned-aosp/mkbootimg.py --header_version 2 --pagesize 4096 --base 0 --kernel_offset 0x8000 --ramdisk_offset 0x1000000 --tags_offset 0x100 --dtb_offset 0x1f00000 --board oneli --kernel independent/kernel --ramdisk independent/ramdisk --dtb independent/dtb --cmdline 'console=ttyMSM0,115200n8 loglevel=8 printk.time=1 rdinit=/init' --output independent/roundtrip.img
          cmp "$image" independent/roundtrip.img
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("out/offline-v2-validation.json")
          report=json.loads(p.read_text())
          report["v2_aosp_repack"]="PASS_BYTE_IDENTICAL"
          report["v2_aosp_pinned_commit"]="7209a7164f1772db43f92928012c86a00f6202ff"
          p.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("ONELI_V2_AOSP_BYTE_IDENTICAL_REPACK_PASS")
          PY
          cp evidence/source-identity.txt out/source-identity.txt
          cp evidence/recipe-result.txt out/recipe-result.txt
          cp evidence/aosp-v2-unpack-info.txt out/aosp-v2-unpack-info.txt
          cp evidence/aosp-v2-reconstruction-arguments.txt out/aosp-v2-reconstruction-arguments.txt
          (cd out && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish offline candidate and manifest
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oneli-v2-self-contained-ram-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 30
          if-no-files-found: error

name: VPU pinned host ABI audit

on:
  pull_request:
    paths:
      - 'scripts/audit-vpu-hfi.py'
      - 'scripts/inventory-oneli-firmware.py'
      - 'tests/vpu/**'
      - '.github/workflows/vpu-hfi-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hfi-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify host test tooling
        run: |
          mkdir -p evidence
          python3 --version | tee evidence/python-version.txt
          cc --version | head -n 1 | tee evidence/compiler-version.txt
      - name: Synthetic Python parser and layout checks
        run: |
          python3 scripts/audit-vpu-hfi.py --self-test | tee evidence/python-selftest.txt
          python3 -m py_compile scripts/audit-vpu-hfi.py scripts/inventory-oneli-firmware.py
          python3 tests/vpu/test-inventory.py -v 2>&1 | tee evidence/inventory-fixture-tests.log
      - name: Synthetic host C layout smoke test (not an ARM64 target build)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -o evidence/hfi-host-layout tests/vpu/hfi-host-layout.c \
            2>&1 | tee evidence/host-compile.log
          ./evidence/hfi-host-layout
      - name: Fetch pinned public host sources and compare ABI
        run: |
          python3 scripts/audit-vpu-hfi.py \
            --json-out evidence/vpu-hfi-audit.json 2>&1 | tee evidence/vpu-hfi-audit.log
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vpu-hfi-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Scope statement
        if: always()
        run: |
          {
            echo "## VPU host ABI audit"
            echo "Kernel baseline: a5ebb76233b79db01e82e061173cb73c6d2b5c6b"
            echo "Project revision: $GITHUB_SHA"
            echo "Host packet definitions and synthetic C layout: audited."
            echo "No oneli firmware, AArch64 kernel build, secure loading, decode or physical hardware claimed."
          } >> "$GITHUB_STEP_SUMMARY"

  iris-candidate-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch exact VPU candidate kernel revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Drzet/linux
          ref: 9bc913217b9051f515970c4b65770efb3374e33a
          path: kernel
          fetch-depth: 1
          persist-credentials: false
      - name: Install ARM64 and schema toolchain
        run: |
          mkdir -p evidence
          sudo apt-get update 2>&1 | tee evidence/apt-update.log
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev python3 python3-venv \
            python3-yaml python3-jsonschema device-tree-compiler \
            perl rsync cpio kmod zstd xz-utils dwarves \
            2>&1 | tee evidence/apt-install.log
          python3 -m venv --system-site-packages schema-venv
          schema-venv/bin/pip install dtschema 2>&1 | tee evidence/pip-dtschema.log
          schema-venv/bin/pip freeze > evidence/pip-freeze.txt
          aarch64-linux-gnu-gcc --version | head -n 1 | tee evidence/cross-gcc.txt
          make --version | head -n 1 | tee evidence/make-version.txt
          git -C kernel rev-parse HEAD | tee evidence/kernel-sha.txt
      - name: Configure and compile candidate Iris module (ARM64, no runtime)
        run: |
          mkdir -p out
          make -C kernel O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig \
            2>&1 | tee evidence/defconfig.log
          grep -E '^CONFIG_VIDEO_QCOM_IRIS=|^CONFIG_MEDIA_SUPPORT=|^CONFIG_ARCH_QCOM=' \
            out/.config | tee evidence/iris-config.txt
          sha256sum out/.config > evidence/config-sha256.txt
          make -C kernel O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j2 modules_prepare 2>&1 | tee evidence/modules-prepare.log
          make -C kernel O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_MODPOST_WARN=1 -j2 M=drivers/media/platform/qcom/iris modules \
            2>&1 | tee evidence/iris-module-build.log
          find kernel out -name 'qcom-iris.ko' -print | tee evidence/iris-modules.txt
          test -s evidence/iris-modules.txt
          echo 'Standalone module compile/link succeeded; missing Module.symvers leaves modpost unresolved symbols (expected in isolated M= build)' | tee evidence/modpost-scope.txt
      - name: Check SM8475 Iris schema
        run: |
          export PATH="$PWD/schema-venv/bin:$PATH"
          make -C kernel ARCH=arm64 O="$PWD/out" \
            DT_SCHEMA_FILES=Documentation/devicetree/bindings/media/qcom,sm8475-iris.yaml \
            dt_binding_check 2>&1 | tee evidence/sm8475-iris-binding.log
      - name: Upload candidate build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vpu-arm64-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Build scope statement
        if: always()
        run: |
          {
            echo "## VPU ARM64 candidate"
            echo "Kernel commit: 9bc913217b9051f515970c4b65770efb3374e33a"
            echo "Project revision: $GITHUB_SHA"
            echo "Standalone Iris module compile + source binding schema check; inspect logs."
            echo "No merged Boot DTS, signed firmware load, HFI response, or device test."
          } >> "$GITHUB_STEP_SUMMARY"
